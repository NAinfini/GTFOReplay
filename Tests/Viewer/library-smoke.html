ReplayInterface.mountLibrary(document.getElementById('library'), {
snapshot:async()=>structuredClone(state),addFolder:async()=>{state.folders.push('E:\\Extra');},configure:async(folders,folder)=>{state.folders=folders;state.defaultFolder=folder;},
importFile:async()=>{},open:async(path)=>{state.errors=['Synthetic open: '+path];},
favorite:async(path,value)=>state.files.find(file=>file.path===path).favorite=value,reveal:async()=>{},trash:async()=>false
});
