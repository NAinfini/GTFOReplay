    const abandoned=new NativeItemModel(170);abandoned.inLevel();abandoned.dispose();await abandoned.ready;assert(abandoned.visual.children.length===0,'Disposed item received a late model');
    checks.push('Source variants remain distinct; static keys have no invented held model; disposed loads cannot reattach');

    checks.push('Power Cell loads its runtime albedo, normal, surface and emissive maps');
