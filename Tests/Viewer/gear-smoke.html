<!doctype html><meta charset="utf-8"><base href="/Viewer/assets/build/main/">
<title>Weapon and tool material validation</title>
<style>body{margin:0;background:#141b20;color:#dce4e1;font:15px system-ui}header{padding:14px 22px;display:flex;align-items:center;gap:18px}select{font:inherit;padding:6px}canvas{display:block}#status{margin-left:auto}</style>
<header><b>Game weapon and tool models</b><select id="model"></select><label><input id="reload" type="checkbox"> Reload / fold</label><span id="status">Loading...</span></header>
<!-- IMPORTS -->
<script type="module">
import * as T from 'three';
import {OrbitControls} from 'three/examples/jsm/controls/OrbitControls.js';
import {ASL_VM as vm} from '../replay/vm.js';
const status=document.querySelector('#status'),select=document.querySelector('#model');
const fail=error=>{window.testResult={passed:false,error:String(error?.stack||error)};status.textContent=String(error);console.error(error)};
window.addEventListener('unhandledrejection',event=>fail(event.reason));
const assert=(value,message)=>{if(!value)throw new Error(message)};
try {
 const scene=new T.Scene();scene.background=new T.Color('#192329');
 scene.add(new T.HemisphereLight(0xd9ebff,0x685443,2.5));
 for(const [position,intensity] of [[[2,3,4],4],[[-3,1,-2],3]]) {const light=new T.DirectionalLight(0xffffff,intensity);light.position.set(...position);scene.add(light)}
 const camera=new T.PerspectiveCamera(35,1,.001,100);
 const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});document.body.append(renderer.domElement);
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.toneMapping=T.ACESFilmicToneMapping;
 const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
 const resize=()=>{const h=innerHeight-document.querySelector('header').offsetHeight;renderer.setSize(innerWidth,h);camera.aspect=innerWidth/h;camera.updateProjectionMatrix()};addEventListener('resize',resize);resize();
 const names=['delivery','flashlight','front','grip','handle','head','mag','main','neck','payload','pommel','receiver','screen','sight','stock','targeting'];
 const {GearDatablock}=(await vm.load('../profiles/vanilla/datablocks/gear/models.js')).exports;
 const {GearBuilder}=(await vm.load('../profiles/vanilla/renderer/models/gearbuilder.js')).exports;
 for(const name of names)await vm.load('../profiles/vanilla/datablocks/gear/parts/'+name+'-vanilla.js');
 await vm.load('../profiles/vanilla/datablocks/gear/models-vanilla.js');
 const entries=[...GearDatablock.datablock.entries()];const models=[];
 assert(entries.length>0,'Gear catalogue did not initialize');
 const exportIndex=new URL(location.href).searchParams.get('exportIndex');
 const selectedEntries=exportIndex===null?entries:entries.filter((_,index)=>index===Number(exportIndex));
 for(const [json,data] of selectedEntries){
  const model=data.model(json);if(model.ready)await model.ready;
  let meshes=0,textured=0;const materials=[];
  model.root.traverse(mesh=>{if(!mesh.isMesh)return;meshes++;for(const material of Array.isArray(mesh.material)?mesh.material:[mesh.material]){materials.push(material);if(material.map)textured++}});
  assert(meshes>0,data.name+' has no model');assert(textured>0,data.name+' has no game textures');
  const colors=materials.filter(m=>m.color).map(m=>[m,m.color.getHex()]);
  if(model instanceof GearBuilder){
   const rest=[];model.reset();model.root.traverse(o=>rest.push([o,o.position.clone(),o.quaternion.clone()]));
   model.animate(.55);model.reset();for(const [o,p,q] of rest){assert(o.position.distanceTo(p)<1e-5,data.name+' rewind position');assert(1-Math.abs(o.quaternion.clone().normalize().dot(q.normalize()))<1e-5,data.name+' rewind rotation')}
   for(const [material,color] of colors)assert(material.color.getHex()===color,data.name+' reload overwrites texture colors');
  }
  models.push({model,name:data.name});select.add(new Option(data.name,models.length-1));status.textContent=`Checked ${models.length}/${entries.length}`;
 }
 let current;
 const show=index=>{if(current)scene.remove(current.root);current=models[index].model;current.reset();scene.add(current.root);current.root.updateMatrixWorld(true);const bounds=new T.Box3().setFromObject(current.root),center=bounds.getCenter(new T.Vector3()),size=bounds.getSize(new T.Vector3()).length();controls.target.copy(center);camera.position.copy(center).add(new T.Vector3(size*.9,size*.35,size*1.5));camera.near=size/1000;camera.far=size*20;camera.updateProjectionMatrix();controls.update()};
 select.onchange=()=>show(Number(select.value));show(0);
 const report={passed:true,models:models.length,parts:216,reloadRewind:true};window.testResult=report;window.gearReview={models,show,entries:entries.map(([key,data])=>({key,name:data.name}))};status.textContent=`PASS · ${models.length} weapons and tools`;
 renderer.setAnimationLoop(time=>{if(current instanceof GearBuilder){current.reset();if(document.querySelector('#reload').checked)current.animate((time%3000)/3000)}controls.update();renderer.render(scene,camera)});
}catch(error){fail(error)}
</script>
